name: safety_guard
description: 안전지키미 – 엽사 근접 경보 앱
publish_to: "none"
version: 1.1.3+23

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^13.0.1
  http: ^1.2.0
  device_info_plus: ^10.1.2
  vibration: ^2.0.1
  just_audio: ^0.9.37
  characters: ^1.3.0
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.0
  get_storage: ^2.1.1
  flutter_tts: ^3.8.0
  permission_handler: ^11.3.1
  flutter_compass: ^0.8.1
  sensors_plus: ^7.0.0
  geomag: ^0.3.0

  # Android / iOS 공통 지도
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/mp3/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"